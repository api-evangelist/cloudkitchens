apis:
- aid: cloudkitchens:cloudkitchens-public-api
  name: CloudKitchens Public API
  description: The CloudKitchens Public API is a resource-oriented REST API over JSON secured with OAuth 2.0, used
    by integration partners — ordering channels, POS and kitchen systems, delivery networks and reporting tools
    — to work with CloudKitchens stores. It publishes 80 operations across 19 endpoint groups (orders, manager orders,
    direct orders, menus, manager menus, storefront, manager storefront, delivery, finance, inventory, reports,
    reviews, loyalty, organization, account pairing, store, auth, callback and ping) plus 27 webhook events, and
    defines 320 reusable component schemas. Every store-scoped call carries an X-Store-Id header naming the partner's
    own identifier for the store, which CloudKitchens translates to its internal store id.
  humanURL: https://developer-guides.cloudkitchens.com/docs/
  baseURL: https://api.cloudkitchens.com
  x-baseURL-note: 'The published OpenAPI ships a templated server, https://{{public-api-url}}, because the concrete
    base URL is provisioned per integration partner at onboarding. api.cloudkitchens.com is the production host:
    it resolves, answers HTTPS, and presents a CloudKitchens-owned wildcard certificate (CN=cloudkitchens.com, SAN
    *.cloudkitchens.com), and CloudKitchens'' own developer portal build names api-staging.cloudkitchens.com as
    its staging counterpart.'
