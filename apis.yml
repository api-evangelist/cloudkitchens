aid: cloudkitchens
name: CloudKitchens
type: Index
description: 'CloudKitchens, operated by City Storage Systems, builds and runs delivery-only "ghost kitchen" facilities
  and the restaurant technology stack that runs them, with sites across roughly 30 countries. For integration partners
  it publishes the CloudKitchens Public API — an OpenAPI 3.0.1 contract of 80 operations and 27 webhook events,
  secured with OAuth 2.0 across 29 scopes and two flows (client credentials and authorization code), backed by an
  OpenID Connect identity provider at iam.cloudkitchens.com. The API spans order injection and fulfillment, menu
  upsert and publishing, storefront pause/resume, delivery dispatch callbacks, finance and payout reporting, inventory,
  reviews, loyalty, and organization/brand/store pairing. Access is partner-gated rather than self-serve: applications,
  webhook endpoints, and stores are onboarded manually by a CloudKitchens Account Representative, who issues the
  Application ID and Client Secret for the production and staging environments and provisions the partner-specific
  API base URL.'
