    Money:
      required:
      - amount
      - currencyCode
      type: object
      properties:
        currencyCode:
          maxLength: 3
          minLength: 3
          type: string
          description: The 3-letter currency code (ISO 4217) to use for all monetary values.
          example: EUR
        amount:
          minimum: 0
          type: number
          description: Amount value.
          example: 25.21
      description: Money amount.
      example: 25.21
