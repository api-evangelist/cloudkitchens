        name:
          type: string
          description: Name of this Item
          example: Bagel
        photoIds:
          type: array
          description: A list of Photo references associated with the Item.
          items:
            type: string
        price:
          $ref: '#/components/schemas/Money'
        priceOverrides:
          type: array
          description: Specify price overrides.
          items:
            $ref: '#/components/schemas/PriceOverride'
        status:
