                    starch: 1.2,
                    protein: 1.3,
                    salt: 1.4,
                    sodium: 1.5,
                    fibres: 1.6,
                    vitaminC: 1.7,
                    calcium: 1.8,
                    magnesium: 1.9,
                    chloride: 2.0,
