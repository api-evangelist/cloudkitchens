        propertyName: type
        mapping:
          PATH: '#/components/schemas/EntityPathOverrideRule'
          FULFILLMENT_MODE: '#/components/schemas/FulfillmentModeOverrideRule'
          SERVICE: '#/components/schemas/ServiceOverrideRule'
